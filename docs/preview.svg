<text xml:space="preserve" x="357.0" y="134" font-size="17" fill="#D8E5E0" font-weight="600" text-anchor="middle">Terminal — nativepipe</text>
<text xml:space="preserve" x="78" y="186" font-size="18" fill="#D9EEE3" font-weight="400" class="mono">$ nativepipe --install-compositor \</text>
<text xml:space="preserve" x="98" y="223" font-size="18" fill="#D9EEE3" font-weight="400" class="mono">demo@linux.example.invalid gtk4-demo</text>
<text xml:space="preserve" x="78" y="290" font-size="19" fill="#94B2A4" font-weight="400">The command keeps running</text>
<text xml:space="preserve" x="78" y="322" font-size="19" fill="#94B2A4" font-weight="400">while the Linux app is open.</text>
<text xml:space="preserve" x="78" y="526" font-size="18" fill="#94B2A4" font-weight="400">Linux execution · SSH transport</text>

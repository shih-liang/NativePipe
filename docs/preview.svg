<text xml:space="preserve" x="777" y="240" font-size="25" fill="#23302F" font-weight="600">Linux application</text>
<text xml:space="preserve" x="777" y="278" font-size="16" fill="#60716E" font-weight="400">Displayed as a Mac window</text>

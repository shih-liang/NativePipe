name: NativePipe continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nativepipe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Transport and licenses
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install compositor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config cmake ninja-build nasm git python3 perl ca-certificates \
            libva-dev libdav1d-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libgles2-mesa-dev libvulkan-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libglib2.0-dev \
            libgdk-pixbuf-2.0-dev librsvg2-dev dbus
      - name: Restore private codec build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/codecs
          key: codecs-ci-ubuntu24-x86_64-gnu-${{ hashFiles('scripts/build-codecs.py') }}
      - name: Build static codec dependencies
        run: python3 scripts/build-codecs.py x86_64-gnu
      - name: Build the complete remote compositor
        run: make -C guest/compositor remote
      - name: Test remote transport
        run: make -C guest/compositor test-remote-transport test-remote-encoder test-remote-scheduler
      - name: Test ordinary-user application service
        run: make -C guest/compositor test-applications
      - name: Test file drag lifecycle
        run: make -C guest/compositor test-file-drag
      - name: Verify source and license inventory
        run: python3 scripts/check-license-inventory.py
      - name: Test release contents
        run: python3 scripts/test-release-packaging.py

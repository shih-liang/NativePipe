name: Build and release NativePipe

on:
  pull_request:
  push:
    branches: [main]
    tags: ["nativepipe-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing nativepipe-v* tag to publish (empty means build only)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nativepipe-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag }}

jobs:
  source:
    name: Resolve source and reusable artifacts
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      linux_run: ${{ steps.resolve.outputs.linux_run }}
      macos_run: ${{ steps.resolve.outputs.macos_run }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Resolve exact commit and complete successful build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if tag and not re.fullmatch(r'nativepipe-v[0-9][A-Za-z0-9._-]*', tag):
              raise SystemExit('Expected an existing nativepipe-v* version tag')
          version = Path('Sources/NativePipeStrings/Resources/VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Release version must use major.minor.patch')
          if tag and tag != f'nativepipe-v{version}':
              raise SystemExit('Release tag must match the packaged version')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          reusable = {'linux': '', 'macos': ''}
          if tag:
              required = {'macos': {'nativepipe-macos-build'}, 'linux': {
                  f'nativepipe-linux-{arch}-{libc}'
                  for arch in ('aarch64', 'x86_64') for libc in ('gnu', 'musl')}}
              runs = api(f'actions/workflows/build-linux.yml/runs?head_sha={commit}&event=push&status=success&per_page=30')
              for run in runs['workflow_runs']:
                  if run['head_branch'] != 'main' or run['head_sha'] != commit:
                      continue
                  artifacts = api(f"actions/runs/{run['id']}/artifacts?per_page=100")['artifacts']
                  available = {a['name'] for a in artifacts if not a['expired']}
                  for platform, names in required.items():
                      if not reusable[platform] and names <= available:
                          reusable[platform] = str(run['id'])
                  if all(reusable.values()):
                      break
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={commit}\ntag={tag}\n')
              for platform, run in reusable.items():
                  output.write(f'{platform}_run={run}\n')
          print(f'Source: {commit}; release: {tag or "none"}; reusable builds: {reusable}')
          PY

  build:
    name: ${{ matrix.architecture }}-${{ matrix.libc }}
    needs: source
    if: needs.source.outputs.linux_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            docker_architecture: arm64
            libc: gnu
            runner: ubuntu-24.04-arm
            image: debian:bookworm-slim
          - architecture: aarch64
            docker_architecture: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            image: alpine:3.22
          - architecture: x86_64
            docker_architecture: amd64
            libc: gnu
            runner: ubuntu-24.04
            image: debian:bookworm-slim
          - architecture: x86_64
            docker_architecture: amd64
            libc: musl
            runner: ubuntu-24.04
            image: alpine:3.22
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Restore private codec build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/codecs
          key: codecs-${{ matrix.architecture }}-${{ matrix.libc }}-${{ hashFiles('scripts/build-codecs.py') }}
      - name: Build and test
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DOCKER_ARCHITECTURE: ${{ matrix.docker_architecture }}
          LIBC: ${{ matrix.libc }}
          BUILDER_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/$DOCKER_ARCHITECTURE" \
            -e ARCH="$ARCHITECTURE" -e LIBC="$LIBC" \
            -v "$PWD:/src" -w /src "$BUILDER_IMAGE" sh -euxc '
              if [ "$LIBC" = gnu ]; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y --no-install-recommends \
                  build-essential pkg-config patchelf cmake ninja-build nasm git python3 perl ca-certificates \
                  libwayland-dev wayland-protocols libxkbcommon-dev \
                  libvulkan-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
                  libgbm-dev libva-dev libdav1d-dev libglib2.0-dev \
                  libgdk-pixbuf-2.0-dev librsvg2-dev dbus xkb-data dconf-gsettings-backend
              else
                apk add --no-cache \
                  build-base pkgconf linux-headers patchelf cmake ninja nasm git python3 perl ca-certificates \
                  wayland-dev wayland-protocols libxkbcommon-dev \
                  vulkan-loader-dev vulkan-headers libdrm-dev mesa-dev libva-dev dav1d-dev glib-dev \
                  gdk-pixbuf-dev librsvg-dev dbus xkeyboard-config dconf
              fi
              python3 scripts/build-codecs.py "$ARCH-$LIBC"
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" test-remote-transport test-remote-encoder test-remote-scheduler
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" test-applications
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" test-file-drag test-scene-damage
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" test-host-open test-notify-dbus test-xwayland-session
              make -C common/file_rpc test-linux
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" dist-vmpipe
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" dist-remote
              make -C guest/session ARCH="$ARCH" LIBC="$LIBC" dist-target
              make -C guest/session ARCH="$ARCH" LIBC="$LIBC" test
              sh scripts/package-remote-compositor.sh "$ARCH" "$LIBC" remote-release
              sh scripts/test-remote-package.sh remote-release
              tar -C remote-release -czf "nativepipe-compositor-$ARCH-$LIBC.tar.gz" .
            '

      - name: Collect checkout-shaped output
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          root=artifact-root
          install -Dm0644 "nativepipe-compositor-$ARCHITECTURE-$LIBC.tar.gz" \
            "$root/nativepipe-compositor-$ARCHITECTURE-$LIBC.tar.gz"
          install -Dm0755 \
            "guest/session/dist/nativepipe-session-$ARCHITECTURE-$LIBC" \
            "$root/guest/session/dist/nativepipe-session-$ARCHITECTURE-$LIBC"
          install -Dm0755 \
            "guest/session/dist/nativepipe-open-$ARCHITECTURE-$LIBC" \
            "$root/guest/session/dist/nativepipe-open-$ARCHITECTURE-$LIBC"
          install -Dm0755 \
            "guest/session/dist/nativepipe-align-blob-$ARCHITECTURE-$LIBC.so" \
            "$root/guest/session/dist/nativepipe-align-blob-$ARCHITECTURE-$LIBC.so"
          install -Dm0755 \
            "guest/session/dist/nativepipe-vulkan-layer-$ARCHITECTURE-$LIBC.so" \
            "$root/guest/session/dist/nativepipe-vulkan-layer-$ARCHITECTURE-$LIBC.so"
          install -Dm0755 \
            "guest/compositor/dist/vmpipe-wayland-$ARCHITECTURE-$LIBC" \
            "$root/guest/compositor/dist/vmpipe-wayland-$ARCHITECTURE-$LIBC"
          install -Dm0755 \
            "guest/compositor/dist/nativepipe-wayland-$ARCHITECTURE-$LIBC" \
            "$root/guest/compositor/dist/nativepipe-wayland-$ARCHITECTURE-$LIBC"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nativepipe-linux-${{ matrix.architecture }}-${{ matrix.libc }}
          path: artifact-root
          if-no-files-found: error
          retention-days: 14

  macos-cli:
    name: macOS universal command and FSKit module
    needs: source
    if: needs.source.outputs.macos_run == ''
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Identify Swift toolchain
        id: toolchain
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk%%.*}" -ge 27 || { echo 'FSKit sharing requires the macOS 27 SDK.' >&2; exit 1; }
          echo "id=$({ swift --version; xcodebuild -version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ needs.source.outputs.commit }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Install static codec build tools
        run: brew install cmake meson ninja nasm
      - name: Test Swift package
        run: make test SWIFT_FLAGS='--disable-sandbox --build-system native -c release --arch arm64'
      - name: Test release assembly and missing-profile rejection
        run: |
          python3 scripts/test-release-packaging.py
          python3 scripts/test-macos-packaging.py
      - name: Build universal command and filesystem extension
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            swift build --disable-sandbox --build-system native -c release --product nativepipe --arch "$arch"
            swift build --disable-sandbox --build-system native -c release --product NativePipeFileSystemExtension --arch "$arch"
          done
          arm="$(swift build --disable-sandbox --build-system native -c release --arch arm64 --show-bin-path)"
          intel="$(swift build --disable-sandbox --build-system native -c release --arch x86_64 --show-bin-path)"
          mkdir -p .build/universal
          for product in nativepipe NativePipeFileSystemExtension; do
            lipo -create "$arm/$product" "$intel/$product" -output ".build/universal/$product"
          done
          cp -R "$arm/NativePipe_NativePipeStrings.bundle" .build/universal/
      - name: Upload compilation outputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nativepipe-macos-build
          path: .build/universal
          if-no-files-found: error
          retention-days: 14

  macos-package:
    name: Sign macOS command and FSKit module
    if: >-
      always() && needs.source.result == 'success' && needs.source.outputs.tag != '' &&
      (needs.source.outputs.macos_run != '' || needs.macos-cli.result == 'success')
    needs: [source, macos-cli]
    runs-on: xcode-27
    environment: lighthouse-runtime-release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Require authorized FSKit signing inputs
        env:
          CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          MOUNT_PROFILE: ${{ secrets.NATIVEPIPE_PROVISIONING_PROFILE_BASE64 }}
          MODULE_PROFILE: ${{ secrets.NATIVEPIPE_FILESYSTEM_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          names = ('CERTIFICATE', 'IDENTITY', 'MOUNT_PROFILE', 'MODULE_PROFILE')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Release requires an Apple signing certificate and authorized FSKit mount/module profiles. Missing: ' + ', '.join(missing))
          PY
      - name: Download compilation outputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nativepipe-macos-build
          path: .build/universal
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.macos_run || github.run_id }}
      - name: Import signing certificate and profiles
        env:
          CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}
          MOUNT_PROFILE: ${{ secrets.NATIVEPIPE_PROVISIONING_PROFILE_BASE64 }}
          MODULE_PROFILE: ${{ secrets.NATIVEPIPE_FILESYSTEM_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'nativepipe-signing'
          directory.mkdir(mode=0o700)
          for name, filename in (('CERTIFICATE', 'certificate.p12'), ('MOUNT_PROFILE', 'mount.provisionprofile'), ('MODULE_PROFILE', 'module.provisionprofile')):
              (directory / filename).write_bytes(base64.b64decode(os.environ[name], validate=True))
          PY
          keychain="$RUNNER_TEMP/nativepipe-signing/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/nativepipe-signing/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
      - name: Package authorized macOS command
        env:
          SIGN_ID: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          NATIVEPIPE_PACKAGE_MODE: distribution
        run: |
          set -euo pipefail
          export NATIVEPIPE_PROVISIONING_PROFILE="$RUNNER_TEMP/nativepipe-signing/mount.provisionprofile"
          export NATIVEPIPE_FILESYSTEM_PROVISIONING_PROFILE="$RUNNER_TEMP/nativepipe-signing/module.provisionprofile"
          sh scripts/package-macos-cli.sh .build/universal/nativepipe macos-release .build/universal/NativePipeFileSystemExtension
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nativepipe-signing/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/nativepipe-signing"
      - name: Upload signed command archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nativepipe-macos-cli
          path: macos-release
          if-no-files-found: error
          retention-days: 14

  package-release:
    name: Package GitHub release
    if: >-
      always() && needs.source.result == 'success' &&
      needs.source.outputs.tag != '' &&
      (needs.source.outputs.linux_run != '' || needs.build.result == 'success') &&
      needs.macos-package.result == 'success'
    needs: [source, build, macos-package]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Download Linux binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: nativepipe-linux-*
          path: .release-input
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.linux_run || github.run_id }}

      - name: Download macOS command
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nativepipe-macos-cli
          path: .macos-input
          github-token: ${{ github.token }}

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-release-packaging.py
          sh scripts/package-release.sh .release-input .macos-input release
          python3 scripts/verify-release.py release

      - name: Upload release files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nativepipe-release
          path: release
          if-no-files-found: error

  sign-release:
    name: Sign GitHub release digest
    if: always() && needs.package-release.result == 'success' && needs.source.outputs.tag != ''
    needs: [source, package-release]
    runs-on: ubuntu-24.04
    environment: lighthouse-runtime-release
    permissions:
      contents: read

    steps:
      - name: Download release files
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nativepipe-release
          path: release

      - name: Sign digest
        shell: bash
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.LIGHTHOUSE_RUNTIME_ED25519_PRIVATE_KEY_BASE64 }}
          EXPECTED_PUBLIC_KEY_BASE64: ${{ vars.LIGHTHOUSE_RUNTIME_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_KEY_BASE64:-}"
          test -n "${EXPECTED_PUBLIC_KEY_BASE64:-}"
          umask 077
          trap 'rm -f private.pem public.der' EXIT
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > private.pem
          openssl pkey -in private.pem -pubout -out release/nativepipe-ed25519-public-key.pem
          openssl pkey -in private.pem -pubout -outform DER -out public.der
          test "$(tail -c 32 public.der | base64 -w0)" = "$EXPECTED_PUBLIC_KEY_BASE64"
          openssl pkeyutl -sign -rawin -inkey private.pem \
            -in release/SHA256SUMS -out release/SHA256SUMS.sig

      - name: Upload signed release files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signed-nativepipe-release
          path: release
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: always() && needs.sign-release.result == 'success' && needs.source.outputs.tag != ''
    needs: [source, sign-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Download signed release files
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-nativepipe-release
          path: release

      - name: Verify digest and signature
        run: |
          python3 scripts/verify-release.py release
          (cd release && sha256sum --check SHA256SUMS)
          openssl pkeyutl -verify -rawin -pubin \
            -inkey release/nativepipe-ed25519-public-key.pem \
            -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "NativePipe ${RELEASE_TAG#nativepipe-v}"
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "NativePipe ${RELEASE_TAG#nativepipe-v}"
          fi

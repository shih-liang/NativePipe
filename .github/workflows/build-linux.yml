name: Build NativePipe Linux binaries

on:
  push:
    branches: [main]
    tags: ["nativepipe-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativepipe-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.architecture }}-${{ matrix.libc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            docker_architecture: arm64
            libc: gnu
            runner: ubuntu-24.04-arm
            image: debian:bookworm-slim
          - architecture: aarch64
            docker_architecture: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            image: alpine:3.22
          - architecture: x86_64
            docker_architecture: amd64
            libc: gnu
            runner: ubuntu-24.04
            image: debian:bookworm-slim
          - architecture: x86_64
            docker_architecture: amd64
            libc: musl
            runner: ubuntu-24.04
            image: alpine:3.22
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Build and test
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DOCKER_ARCHITECTURE: ${{ matrix.docker_architecture }}
          LIBC: ${{ matrix.libc }}
          BUILDER_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/$DOCKER_ARCHITECTURE" \
            -e ARCH="$ARCHITECTURE" -e LIBC="$LIBC" \
            -v "$PWD:/src" -w /src "$BUILDER_IMAGE" sh -euxc '
              if [ "$LIBC" = gnu ]; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y --no-install-recommends \
                  build-essential pkg-config \
                  libwayland-dev wayland-protocols libxkbcommon-dev \
                  libvulkan-dev libdrm-dev
              else
                apk add --no-cache \
                  build-base pkgconf linux-headers \
                  wayland-dev wayland-protocols libxkbcommon-dev \
                  vulkan-loader-dev vulkan-headers libdrm-dev
              fi
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" test-remote-transport
              make -C guest/compositor ARCH="$ARCH" LIBC="$LIBC" dist-vmpipe
              make -C guest/session ARCH="$ARCH" LIBC="$LIBC" dist-target
            '

      - name: Collect checkout-shaped output
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          root=artifact-root
          install -Dm0755 \
            "guest/session/dist/nativepipe-session-$ARCHITECTURE-$LIBC" \
            "$root/guest/session/dist/nativepipe-session-$ARCHITECTURE-$LIBC"
          install -Dm0755 \
            "guest/session/dist/nativepipe-align-blob-$ARCHITECTURE-$LIBC.so" \
            "$root/guest/session/dist/nativepipe-align-blob-$ARCHITECTURE-$LIBC.so"
          install -Dm0755 \
            "guest/session/dist/nativepipe-vulkan-layer-$ARCHITECTURE-$LIBC.so" \
            "$root/guest/session/dist/nativepipe-vulkan-layer-$ARCHITECTURE-$LIBC.so"
          install -Dm0755 \
            "guest/compositor/dist/vmpipe-wayland-$ARCHITECTURE-$LIBC" \
            "$root/guest/compositor/dist/vmpipe-wayland-$ARCHITECTURE-$LIBC"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nativepipe-linux-${{ matrix.architecture }}-${{ matrix.libc }}
          path: artifact-root
          if-no-files-found: error
          retention-days: 14

  package-release:
    name: Package GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Download Linux binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: nativepipe-linux-*
          path: .release-input

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for architecture in aarch64 x86_64; do
            root=".release-$architecture"
            mkdir -p "$root"
            cp -R ".release-input/nativepipe-linux-$architecture-gnu/." "$root/"
            cp -R ".release-input/nativepipe-linux-$architecture-musl/." "$root/"
            mkdir -p "$root/guest/session"
            cp -R guest/session/implicit_layer guest/session/openrc \
              guest/session/profile.d guest/session/systemd "$root/guest/session/"
            cp -R LICENSES "$root/LICENSES"
            tar -C "$root" -czf "release/nativepipe-linux-$architecture.tar.gz" .
          done

          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: Upload release files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nativepipe-release
          path: release
          if-no-files-found: error

  sign-release:
    name: Sign GitHub release digest
    if: startsWith(github.ref, 'refs/tags/')
    needs: package-release
    runs-on: ubuntu-24.04
    environment: lighthouse-runtime-release
    permissions:
      contents: read

    steps:
      - name: Download release files
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nativepipe-release
          path: release

      - name: Sign digest
        shell: bash
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.LIGHTHOUSE_RUNTIME_ED25519_PRIVATE_KEY_BASE64 }}
          EXPECTED_PUBLIC_KEY_BASE64: ${{ vars.LIGHTHOUSE_RUNTIME_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_KEY_BASE64:-}"
          test -n "${EXPECTED_PUBLIC_KEY_BASE64:-}"
          umask 077
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > private.pem
          openssl pkey -in private.pem -pubout -out release/nativepipe-ed25519-public-key.pem
          openssl pkey -in private.pem -pubout -outform DER -out public.der
          test "$(tail -c 32 public.der | base64 -w0)" = "$EXPECTED_PUBLIC_KEY_BASE64"
          openssl pkeyutl -sign -rawin -inkey private.pem \
            -in release/SHA256SUMS -out release/SHA256SUMS.sig

      - name: Upload signed release files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signed-nativepipe-release
          path: release
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: sign-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed release files
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-nativepipe-release
          path: release

      - name: Verify digest and signature
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          openssl pkeyutl -verify -rawin -pubin \
            -inkey release/nativepipe-ed25519-public-key.pem \
            -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
